name: Build

# Chaque push compile Windows et macOS (dépôt public : minutes gratuites).
# Pas de version Linux : inutile pour l'usage prévu (le développement local, lui, reste testé sous Linux).
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore: [ '**.md' ]
  pull_request:
  workflow_dispatch:

# Un nouveau push annule la compilation en cours du précédent : pas de minutes gaspillées.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest ]

    env:
      # Cache de compilation (macOS) : seuls les fichiers modifiés sont recompilés
      # d'un push à l'autre. La compilation universelle macOS passe de ~50 à quelques minutes.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Restaurer le cache de compilation
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Réglages propres à la plateforme
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows)
              echo "CMAKE_EXTRA=" >> "$GITHUB_ENV"
              echo "PLUGINVAL_ARCHIVE=pluginval_Windows.zip" >> "$GITHUB_ENV"
              echo "PLUGINVAL=pluginval/pluginval.exe" >> "$GITHUB_ENV" ;;
            macOS)
              # Binaire universel : Apple Silicon + Intel
              brew install ccache ninja
              echo "CMAKE_EXTRA=-G Ninja -DCMAKE_OSX_ARCHITECTURES=arm64;x86_64 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
              echo "PLUGINVAL_ARCHIVE=pluginval_macOS.zip" >> "$GITHUB_ENV"
              echo "PLUGINVAL=pluginval/pluginval.app/Contents/MacOS/pluginval" >> "$GITHUB_ENV" ;;
          esac

      - name: Configurer
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $CMAKE_EXTRA

      - name: Compiler
        run: cmake --build build --config Release --parallel

      - name: Tests unitaires
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Valider le VST3 avec pluginval
        shell: bash
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/$PLUGINVAL_ARCHIVE"
          unzip -q pluginval.zip -d pluginval
          chmod +x "$PLUGINVAL" || true

          "$PLUGINVAL" --strictness-level 10 --timeout-ms 300000 \
            --validate "build/SubdAmp_artefacts/Release/VST3/SubdAmp.vst3"

      - name: Préparer l'archive
        shell: bash
        run: |
          ARTEFACTS="build/SubdAmp_artefacts/Release"
          ARCHIVE="SubdAmp-$RUNNER_OS.zip"
          mkdir -p dist/licences
          cp -R "$ARTEFACTS/VST3/SubdAmp.vst3" dist/

          # Polices intégrées à l'interface (SIL OFL 1.1) : leur licence voyage avec le binaire.
          cp assets/fonts/OFL-*.txt dist/licences/

          # On zippe nous-mêmes : upload-artifact ne conserve pas les droits d'exécution.
          case "$RUNNER_OS" in
            macOS)
              cp -R "$ARTEFACTS/Standalone/SubdAmp.app" dist/
              ditto -c -k --sequesterRsrc dist "$ARCHIVE" ;;
            Windows)
              cp "$ARTEFACTS/Standalone/SubdAmp.exe" dist/
              7z a "$ARCHIVE" ./dist/* > /dev/null ;;
          esac

      - name: Publier les binaires
        uses: actions/upload-artifact@v7
        with:
          name: SubdAmp-${{ runner.os }}
          path: SubdAmp-${{ runner.os }}.zip
